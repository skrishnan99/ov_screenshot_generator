variant: ov80i
# The app requires a visit to the origin first to establish its session;
# hitting /recipes cold shows a permission error.
entry_path: /
steps:
  - id: enter_recipe_editor
    path: /recipes
    goal: |
      You are on the All Recipes page of an OV80i camera, which lists recipes with their
      status (Active/Inactive) and per-row buttons.

      Find the recipe that best matches this user-provided (approximate) name: "{recipe}"

      Then open its editor:
      - If that recipe is marked Active: click its "Edit" button, then click "Open Editor"
        in the dialog that appears.
      - If it is marked Inactive: click its "Activate" button, then in the dialog that
        appears click the button that activates it and goes to the editor (labeled like
        "Activate and go to editor").
    postcondition: |
      The Recipe Editor page for the matched recipe is open: the URL matches
      /recipes/<number>/editor and the matched recipe's name is visible on the page.
    success_url_regex: "/recipes/\\d+/editor"
    screenshot: "01_recipe_editor"

  - id: imaging_setup
    # No path: continues from the recipe editor page opened by the previous step.
    goal: |
      You are on the Recipe Editor page for the recipe. Open its Imaging Setup page by
      clicking "Configure Imaging" (in the Imaging Setup panel).

      If any confirmation dialogs or modals appear along the way (for example warnings
      about stopping a recipe, entering live imaging, or camera control), read them and
      choose the option that proceeds to the imaging configuration; do not cancel or
      abandon the flow. Wait until the imaging page has fully loaded before finishing.
    postcondition: |
      The Imaging Setup / Configure Imaging page is open and loaded: imaging controls
      (such as exposure, gain, gamma, trigger settings, or a live camera view) are
      visible, and this is no longer the editor overview page.
    success_text:
      - "Camera Settings"
      - "Trigger Settings"
    # Record the main image area's pixel bbox (relative to the screenshot)
    # into meta.json as imaging_setup_img_bbox.
    capture_image_bbox: true
    screenshot: "02_imaging_setup"

  - id: template_image
    # No path: continues from the Imaging Setup page opened by the previous step.
    goal: |
      You are on the Imaging Setup page of a recipe. First go back to the Recipe Editor
      overview page for this same recipe (for example via the recipe-name breadcrumb at
      the top, or the "Recipe Editor" entry in the sidebar).

      Once you are back on the Recipe Editor overview, open the "Template Image and
      Alignment" page from there (it is listed under Image Alignment & Inspection Setup).

      If any confirmation dialogs or modals appear along the way, read them and choose
      the option that proceeds; do not cancel or abandon the flow. EXCEPTION: a
      promotional or walkthrough modal (e.g. "Try out the New Aligner") is closed, not
      followed — press Escape or choose the dismissive option ("I'll Explore on my
      own"); never start the walkthrough or tour. Wait until the page has fully loaded
      before finishing.
    postcondition: |
      The Template Image and Alignment page is open and loaded (template image /
      alignment configuration is visible), not the editor overview and not Imaging Setup.
    success_text:
      - "Re-Capture Template Image"
      - "Skip Aligner"
    # A fresh browser session is greeted here by a feature-promo modal
    # ("Try out the New Aligner"); nothing is persisted on dismissal, so it
    # appears EVERY run. Closed deterministically before the vision wait —
    # it covers the image viewer — and before the capture.
    dismiss_promo_modal: true
    # Poll (vision) until the template image has rendered before capturing.
    wait_image_loaded:
      interval_s: 7
      max_wait_s: 60
    # Also save the viewer's actual image at native resolution
    # (03_template_image_raw.*) and record how in meta.json.
    download_main_image: true
    screenshot: "03_template_image"

  - id: inspection_rois
    # No path: continues from the Template Image page opened by the previous step.
    goal: |
      You are on the Template Image and Alignment page of a recipe. First go back to the
      Recipe Editor overview page for this same recipe (for example via the recipe-name
      breadcrumb at the top, or the "Recipe Editor" entry in the sidebar).

      Once you are back on the Recipe Editor overview, open the "Inspection Parameters"
      page from there (it is listed under Image Alignment & Inspection Setup).

      If any confirmation dialogs or modals appear along the way, read them and choose
      the option that proceeds; do not cancel or abandon the flow. Wait until the page
      has fully loaded before finishing.
    postcondition: |
      The Inspection Setup / Inspection Editor page is open and loaded: the ROI editor
      with its Models section is visible.
    success_url_regex: "/recipes/\\d+/inspection"
    success_text:
      - "Inspection Editor"
    foreach_models: true
    screenshot: "04_roi"

  - id: segmentation_block_stats
    # No path: continues from the Inspection Setup page opened by the previous
    # step. The block page's INITIAL view — before any "Previous" click — is
    # the one whose class panel shows the per-class labelled-image bars for
    # ALL of this block's models; clicking Previous swaps the panel to the
    # annotation state and the bars disappear. So the stats harvest runs
    # here, and the screenshot step (which clicks Previous) runs after.
    goal: |
      You are on the Inspection Setup page of a recipe. First go back to the Recipe
      Editor overview page for this same recipe (for example via the recipe-name
      breadcrumb at the top).

      On the Recipe Editor overview, look at the "AI Blocks" section:
      - If a Segmentation model is present (for example "Segmentation (1 Model)"),
        click on it to open the segmentation model page, then use wait_seconds
        (3-5s) and a fresh snapshot to make sure the page has fully loaded.
        Do ONLY the navigation: do NOT click "Previous" or "Next", do not open
        any modal, and do not change any setting — this step only brings up
        the page's initial view.
      - If the AI Blocks section shows no Segmentation model (0 Models), stay on
        the Recipe Editor overview and finish there.

      If any confirmation dialogs or modals appear along the way, read them and
      choose the option that proceeds; do not cancel or abandon the flow.
    postcondition: |
      Either the Segmentation Block page is open in its initial view (no modal
      open, Previous not clicked), or — when the recipe has no segmentation
      model — the Recipe Editor overview is displayed.
    always_agent: true
    collect_block_stats: segmentation

  - id: segmentation_block
    # No path: continues from the Segmentation Block page opened by the stats
    # step above. This step clicks "Previous" to load a real capture into the
    # viewer for the screenshot — which is exactly why the stats harvest ran
    # BEFORE it.
    goal: |
      You should be on the Segmentation Block page of a recipe, opened by the
      previous step. If you are not, go to the Recipe Editor overview page for
      this same recipe (for example via the recipe-name breadcrumb at the top)
      and, in the "AI Blocks" section, click the Segmentation model to open it;
      if the recipe has no Segmentation model (0 Models), stay on the Recipe
      Editor overview and finish there.

      On the Segmentation Block page, call wait_for_button_enabled with text
      "Previous" — capture data can take a while to load, and the tool waits
      adaptively:
        - If it reports Previous enabled, click Previous, then call
          wait_for_image_load to wait until the capture image has fully rendered (it
          polls a vision model). When it reports the image loaded, finish. If it
          reports the image still not loaded after its maximum wait, take a screenshot
          yourself to judge the state, then finish on the page as it is.
        - If it reports Previous still disabled with the page settled (or no Previous
          at all), finish on the page as it is.
        - If it reports the ceiling was hit with the page still changing, take a fresh
          snapshot to judge the state yourself, then proceed accordingly.

      If any confirmation dialogs or modals appear along the way, read them and choose
      the option that proceeds; do not cancel or abandon the flow. Wait until the page
      has fully loaded before finishing.
    postcondition: |
      Either the segmentation model page for this recipe is open and fully loaded (with
      the previous view loaded if a clickable Previous button existed), or — when the
      recipe has no segmentation model — the Recipe Editor overview is displayed.
    # The flow branches on live data (segmentation model present? Previous button
    # clickable?), which a recorded trace cannot re-evaluate — always use the agent.
    always_agent: true
    # The "Source Capture: n of N" readout only renders once Previous has
    # loaded a capture — so the total-captures count is read here, and the
    # class bars on the pre-Previous view by the stats step above.
    collect_block_total: segmentation
    screenshot: "05_segmentation"

  - id: view_all_rois_segmentation
    # No path: continues from the segmentation page opened by the previous step.
    goal: |
      You are on the Segmentation page of a recipe. Do nothing except make sure this
      page is displayed (if a modal is open, close it). The per-model captures are
      driven separately.
    postcondition: |
      The Segmentation page (or the Recipe Editor overview, when the recipe has no
      segmentation model) is displayed.
    # One capture per segmentation model — see the classification step below.
    foreach_block_models: segmentation
    item_label: "View All ROIs grid"
    meta_key: view_rois_screenshot
    per_model_goal: |
      You are on the Segmentation Block page of a recipe. Make sure the page's
      "Segmentation Model" selector has "{model}" selected — if a different model is
      selected, open the selector and choose "{model}". If a "View All ROIs" modal is
      already open, close it first, then re-select the model.

      Then click "View All ROIs" and call wait_for_image_load so the thumbnail grid
      finishes rendering. When it reports loaded, finish. If it reports still not
      loaded at its ceiling, take a screenshot to judge the state, then finish.
    per_model_postcondition: |
      The View All ROIs grid for the segmentation model "{model}" is open and fully
      rendered.
    # The View ROIs view can open as a dedicated model-scoped page that does
    # not show the recipe name anywhere.
    check_recipe: false
    always_agent: true
    screenshot: "06_view_all_rois_segmentation"

  - id: classification_block_stats
    # No path: continues from wherever the previous step ended (possibly with
    # the View All ROIs modal still open). Same pre-"Previous" harvest as
    # segmentation_block_stats: the initial view's class panel carries the
    # per-class labelled-image bars ("Inspection Types"), which the
    # screenshot step's Previous click swaps away.
    goal: |
      You may be on the Segmentation page of a recipe, possibly with a "View All ROIs"
      modal open. If a modal is open, close it first (Ok / Close / X).

      Then go back to the Recipe Editor overview page for this same recipe (for example
      via the recipe-name breadcrumb at the top).

      On the Recipe Editor overview, look at the "AI Blocks" section:
      - If a Classification model is present (for example "Classification (1 Model)"),
        click on it to open the classification model page, then use wait_seconds
        (3-5s) and a fresh snapshot to make sure the page has fully loaded.
        Do ONLY the navigation: do NOT click "Previous" or "Next", do not open
        any modal, and do not change any setting — this step only brings up
        the page's initial view.
      - If the AI Blocks section shows no Classification model (0 Models), stay on
        the Recipe Editor overview and finish there.

      If any confirmation dialogs or modals appear along the way, read them and
      choose the option that proceeds; do not cancel or abandon the flow.
    postcondition: |
      Either the Classification Block page is open in its initial view (no modal
      open, Previous not clicked), or — when the recipe has no classification
      model — the Recipe Editor overview is displayed.
    always_agent: true
    collect_block_stats: classification

  - id: classification_block
    # No path: continues from the Classification Block page opened by the stats
    # step above. Clicks "Previous" to load a real capture for the screenshot —
    # which is exactly why the stats harvest ran BEFORE it.
    goal: |
      You should be on the Classification Block page of a recipe, opened by the
      previous step. If you are not, go to the Recipe Editor overview page for
      this same recipe (for example via the recipe-name breadcrumb at the top)
      and, in the "AI Blocks" section, click the Classification model to open it;
      if the recipe has no Classification model (0 Models), stay on the Recipe
      Editor overview and finish there.

      On the Classification Block page, call wait_for_button_enabled with text
      "Previous" — capture data can take a while to load, and the tool waits
      adaptively:
        - If it reports Previous enabled, click Previous, then call
          wait_for_image_load to wait until the capture image has fully rendered (it
          polls a vision model). When it reports the image loaded, finish. If it
          reports the image still not loaded after its maximum wait, take a screenshot
          yourself to judge the state, then finish on the page as it is.
        - If it reports Previous still disabled with the page settled (or no Previous
          at all), finish on the page as it is.
        - If it reports the ceiling was hit with the page still changing, take a fresh
          snapshot to judge the state yourself, then proceed accordingly.

      If any confirmation dialogs or modals appear along the way, read them and choose
      the option that proceeds; do not cancel or abandon the flow.
    postcondition: |
      Either the classification model page for this recipe is open and fully loaded
      (with the previous view loaded if a clickable Previous button existed), or —
      when the recipe has no classification model — the Recipe Editor overview is
      displayed.
    always_agent: true
    # Same as segmentation: the capture total only shows post-Previous.
    collect_block_total: classification
    screenshot: "07_classification"

  - id: view_all_rois_classification
    # No path: continues from the classification page opened by the previous step.
    goal: |
      You are on the Classification page of a recipe. Do nothing except make sure
      this page is displayed (if a modal is open, close it). The per-model captures
      are driven separately.
    postcondition: |
      The Classification page (or the Recipe Editor overview, when the recipe has
      no classification model) is displayed.
    # A block page shows ONE model at a time, so a single screenshot can only be
    # correct for one model. Capture the ROI grid per classification model.
    foreach_block_models: classification
    item_label: "View All ROIs grid"
    meta_key: view_rois_screenshot
    per_model_goal: |
      You are on the Classification Block page of a recipe. Make sure the page's
      classification model selector has "{model}" selected — if a different model is
      selected, open the selector and choose "{model}". If a "View All ROIs" modal is
      already open, close it first, then re-select the model.

      Then click "View All ROIs" and call wait_for_image_load so the thumbnail grid
      finishes rendering. When it reports loaded, finish. If it reports still not
      loaded at its ceiling, take a screenshot to judge the state, then finish.
    per_model_postcondition: |
      The View All ROIs grid for the classification model "{model}" is open and
      fully rendered.
    # The View ROIs view can open as a dedicated model-scoped page that does
    # not show the recipe name anywhere.
    check_recipe: false
    always_agent: true
    screenshot: "08_view_all_rois_classification"

  - id: train_models
    # No path: continues from wherever the previous step ended (the classification
    # view-all-ROIs modal may still be open, or the editor overview when the recipe
    # had no classification model).
    goal: |
      If any modal is open, close it first (Ok / Close / X). Then, unless you are
      already there, go back to the Recipe Editor overview page for this same recipe
      (for example via the recipe-name breadcrumb at the top).

      On the Recipe Editor overview, click the "Train Models" button (in the AI Blocks
      section). Wait until the resulting page has fully loaded before finishing — if
      content is still loading, use wait_seconds and check again.

      If any confirmation dialogs or modals appear along the way, read them and choose
      the option that proceeds; do not cancel or abandon the flow.
    postcondition: |
      The Train Models page is open and fully loaded.
    # This page has no imagery — its content is the model table, whose skeleton
    # rows render instantly. Without polling, the capture succeeds against a
    # page showing no models at all, and the training-report enumeration that
    # follows reads the column headers as data.
    wait_table_loaded:
      interval_s: 5
      max_wait_s: 60
    screenshot: "09_train_models"

  - id: training_reports
    # No path: continues from the Train Models page opened by the previous step.
    goal: |
      You should be on the Train Models page of the recipe. If you are not (or a modal
      is open), close any modal and navigate there: recipe-name breadcrumb to the
      Recipe Editor overview, then click "Train Models". Wait until the page has fully
      loaded before finishing. Do not open any training report yourself — just make
      sure the Train Models page is displayed.
    postcondition: |
      The Train Models page is open and fully loaded, listing the recipe's models.
    # Per-model training reports are enumerated from live data every run and
    # screenshotted as <model-name>_<model-type>.png (only models whose report
    # "View" control is available); no reports -> no screenshots.
    foreach_reports: true
    screenshot: "10_training_reports"

  - id: model_settings
    # No path: continues from the Train Models page (step may end with a report
    # just closed).
    goal: |
      You should be on the Train Models page of the recipe. If you are not (or a
      modal/report is open), close any modal and navigate there: recipe-name
      breadcrumb to the Recipe Editor overview, then click "Train Models". Wait until
      the page has fully loaded before finishing. Do not open any settings dialog
      yourself — just make sure the Train Models page is displayed.
    postcondition: |
      The Train Models page is open and fully loaded, listing the recipe's models.
    # Each model's settings are enumerated from live data every run and
    # screenshotted as <model-name>_<model-type>_settings.png.
    foreach_settings: true
    screenshot: "11_model_settings"

  - id: io_node_red_view
    # No path: continues from the Train Models page (a settings dialog may still
    # be open from the previous step). Brings up the IO / Node-RED flow view and
    # captures it as a deliverable BEFORE the export step opens any dialog over
    # it — the screenshot must show the loaded flow, not the Export dialog.
    goal: |
      If any modal or settings dialog is open, close it first (Close / Ok / X / Cancel).

      Go back to the Recipe Editor overview page for this same recipe (for example via
      the recipe-name breadcrumb at the top). On the editor overview, click
      "Configure IO" (in the "Set Pass/Fail & IO Logic" panel), and wait for the IO
      page to fully load (use wait_seconds, 5-10s — it can take a while). The
      Node-RED flow editor canvas may be marked [iframe] in snapshots — on this
      page it usually is, without any further navigation.

      The IO page and the Node-RED editor load slowly and re-render: after opening
      it, use wait_seconds (5-10s) BEFORE taking the snapshot you act on. If a
      click times out with "element may be covered or gone", the page changed under
      you — do not retry the same ref; wait a few seconds, take a fresh snapshot,
      and re-locate the control. Prefer controls whose text or row context clearly
      matches what you need over blind clicks on empty-text icon buttons.

      Do ONLY the navigation: do not click any node, do not open any export or
      settings dialog, and NEVER click "Deploy" (it pushes pending flow changes
      live on a production camera). Finish once the flow canvas is visible and
      has finished loading, with no dialog covering it.
    postcondition: |
      The IO page is open with the Node-RED flow editor canvas fully loaded and
      visible, and no dialog is covering it.
    check_recipe: false
    # Numbered 12 alongside 12_library: library's filename is a published
    # contract for existing runs, so it keeps its number; "io" sorts before
    # "library", preserving step order in the folder listing.
    screenshot: "12_io_node_red"
    # The deliverable is the flow itself: capture only the embedded Node-RED
    # iframe, not the surrounding camera-UI chrome. Falls back to a full-page
    # capture (with a warning) if no dominant iframe is present.
    screenshot_iframe: true
    # Node-RED's own palette (left, all nodes) and sidebar (right, info) can
    # cover parts of the flow: close each one right before the capture, only
    # if it is actually open (their shortcuts are toggles).
    close_node_red_panels: true
    # The slow-loading Node-RED iframe can eat turns on stale refs.
    max_model_calls: 25
    always_agent: true

  - id: io_node_red
    # No path: continues from the loaded IO / Node-RED view left by the
    # previous step. Produces the downloaded Node-RED flow JSON; the
    # deliverable screenshot was already captured by io_node_red_view, so the
    # Export dialog this step opens can never appear in it.
    goal: |
      The IO page with the Node-RED flow editor canvas should already be open and
      loaded from the previous step. If it is not (or a modal/settings dialog is
      open), close any dialog, go to the Recipe Editor overview page for this same
      recipe (for example via the recipe-name breadcrumb at the top), click
      "Configure IO" (in the "Set Pass/Fail & IO Logic" panel), and wait for the
      IO page to fully load (use wait_seconds, 5-10s — it can take a while).

      PREFERRED PATH — the Node-RED export keyboard shortcut: as soon as a Node-RED
      flow editor canvas is visible (its content may be marked [iframe] in
      snapshots — on this page it usually is, without any further navigation),
      click ONCE on an empty spot of the flow canvas to give it keyboard focus —
      NEVER click "Deploy" (it pushes pending flow changes live on a production
      camera) and do not click any node; an empty patch of the canvas grid is
      enough. Then call press_keys with "ControlOrMeta+e". That opens Node-RED's
      Export dialog directly; click "Download" in it for the current flow. This triggers
      a JSON download of the flow, captured automatically — you do not need to
      look for the downloaded file.

      FALLBACK — only if no flow canvas is visible on the IO page, or the Export
      dialog does not open after two shortcut attempts: open the Node-RED view via
      the icon-only breadcrumb control at the top right, then use the shortcut (or
      the "Export" menu entry) there, and click "Download".

      The IO page and the Node-RED editor load slowly and re-render: after opening
      either, use wait_seconds (5-10s) BEFORE taking the snapshot you act on. If a
      click times out with "element may be covered or gone", the page changed under
      you — do not retry the same ref; wait a few seconds, take a fresh snapshot,
      and re-locate the control. Prefer controls whose text or row context clearly
      matches what you need over blind clicks on empty-text icon buttons.

      If any confirmation dialogs appear along the way, read them and choose the
      option that proceeds; do not cancel or abandon the flow.
    postcondition: |
      The Node-RED export dialog's Download was clicked for the current flow (a JSON
      download was triggered).
    check_recipe: false
    expect_download: true
    download_as: node_red_flow.json
    # Icon-only buttons don't replay reliably (two flaky-replay incidents);
    # the agent handles this flow consistently. The slow-loading Node-RED
    # iframe can eat many turns on stale refs, hence the raised budget.
    max_model_calls: 35
    always_agent: true

  - id: library
    # No path: continues from the Node-RED / IO view left by the previous step.
    goal: |
      You may be in a Node-RED or IO configuration view. If any modal, export dialog,
      or settings dialog is open, close it first (Close / Ok / X / Cancel).

      Then click "Library" in the left sidebar to open the Library page. If the left
      sidebar is not visible, first use any back/close/breadcrumb controls on the page
      to return to the main camera UI. Wait until the page has fully loaded before
      finishing — if content is still loading, use wait_seconds and check again.
    postcondition: |
      The Library page is open and fully loaded.
    # The Library is a global page — the recipe name is not expected on it.
    check_recipe: false
    # The viewer image lazy-loads ("Loading capture details..."); a fast
    # replay once downloaded a BLANK base layer, so wait for real imagery
    # before capturing/downloading.
    wait_image_loaded:
      interval_s: 7
      max_wait_s: 60
    # Save the main viewer image (raw + overlays + composite) like the template step.
    download_main_image: true
    screenshot: "12_library"
