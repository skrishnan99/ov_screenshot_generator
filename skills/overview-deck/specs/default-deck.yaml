# The default OV camera test report — THE base spec.
#
# Compiles verbatim; mutates only on an explicit user request, only as
# requested (adapt.py). Content holes are DESCRIPTIONS — matching is
# semantic, so file renames and camera variants cannot break this file.
#
# TRAINED MODELS ONLY: the ROI section and the per-model blocks cover the
# models the Train screen shows as actually trained (last_trained date /
# training metrics / a training report). Models with ROIs that were never
# trained are ignored by design. When the run carries no training signal at
# all, every model is included and the gap is recorded in the plan.
#
# Skeleton fill notes:
# - recipe_title_* keep their standing hero photo (no image passed).
# - ONE concise results card per deck (concise_results_classifier), after
#   all model training slides. On a stat card an em dash is the designed
#   no-data mark, so unstated values resolve "—".

spec_version: 1

slides:
  # -- 1. recipe title: the variant's own v1 skeleton, hero photo standing.
  - id: title_ov80i
    skeleton: recipe_title_ov80i
    when: {camera.variant: ov80i}
    tokens:
      recipe_title: "{recipe.name}"

  - id: title_ov20i
    skeleton: recipe_title_ov20i
    when:
      any:
        - {camera.variant: ov20i}
        - {camera.variant: ov10i}
    tokens:
      recipe_title: "{recipe.name}"

  # -- 2. overall results: one-liner + raw|overlay pair, fixed skeleton.
  - id: results_overview
    skeleton: results_image
    tokens:
      recipe_name: "{recipe.name}"
      brief_description:
        llm: >
          One line: the inspection problem and how the camera solves it —
          the part, what is checked, and the decision made.
        max_chars: 160
    images:
      - expects: >
          The library capture as imaged — the part photograph at native
          resolution with NO inspection overlay drawn.
      - expects: >
          The same library capture WITH the inspection overlay drawn —
          regions and marks as the UI shows them.

  # -- 3. imaging setup: fixed content, near-fixed layout (tier 3 + hint).
  - id: imaging
    tier: 3
    step: true
    title: "Step {step}: Imaging Setup"
    hint: >
      One split slide, exactly like the house imaging-setup template: the
      imaging screen on the left at about 55% width, and a short bold
      explanation in the right-hand column. Title stays as given.
    images:
      - expects: >
          The Imaging Setup screen: camera settings panel (exposure, white
          balance, trigger mode) beside the main viewer.
    tokens:
      text:
        llm: >
          One line on the imaging configuration, leading with any special
          technique deliberately used — photometric stereo, HDR, rotation,
          multi-exposure. If none, the capture conditions in plain language
          (resolution class, trigger mode).
        max_chars: 170

  # -- 4. alignment, ONLY when the aligner is actually configured.
  - id: aligner
    tier: 3
    step: true
    when: {aligner.skipped: false}
    title: "Step {step}: Alignment"
    hint: >
      One split slide, exactly like the house aligner-setup template: the
      alignment screen left at about 55% width, short bold explanation right.
    images:
      - expects: >
          The Template Image and Alignment screen — template viewer and
          search-area controls.
    tokens:
      text:
        llm: >
          One or two lines on how alignment is set up: what the template
          anchors to and what the search areas cover.
        max_chars: 220

  # -- 5. inspection regions: every TRAINED model's ROI screen, one section.
  - id: rois
    tier: 3
    step: true
    title: "Step {step}: Inspection Regions"
    hint: >
      Show every region screen at a readable size — pair two per slide when
      there are several, one large when there is one. Keep the shared
      description with the first slide.
    images:
      # optional: a model whose region screen went uncaptured must not sink
      # the models that WERE captured; all-unmatched still drops the slide.
      - foreach: models
        where: {trained: true}
        optional: true
        expects: >
          The Inspection Setup screen with {model.name} selected and its
          regions of interest drawn on the part — where THIS model looks.
    tokens:
      text:
        llm: >
          A brief description of how the inspection regions are set up
          across the trained models: which areas of the part each model
          covers and how the regions divide the work. 2-3 sentences.
        max_chars: 300

  # -- 6. one training slide per trained model.
  - id: training
    repeat: models
    where: {trained: true}
    tier: 3
    step: true
    title: "Step {step}: Training — {model.name} ({model.type_title})"
    hint: >
      One split slide, like the house setup templates: the block page
      on the left at about 55% width, the right-hand column carrying
      the setup/training summary with the why-this-approach rationale
      beneath it.
    images:
      # The TYPE'S BLOCK PAGE, not the Train screen's dialogs: it shows
      # an example annotated training image on the part with the model's
      # classes beside it — the screen a customer can actually read.
      - expects: >
          The {model.type} Block page with {model.name} shown — an
          example annotated training image of the part in the viewer,
          with the model's classes listed beside it. Not the Train
          Models screen, not a settings dialog, not an ROI gallery.
    tokens:
      text:
        llm: >
          How {model.name} was set up and trained, in plain language:
          what it decides (classes / defect classes), and the training
          choices visible in the material. 2-4 short lines.
        shape: lines
        max_chars: 280
      # The WHY, not just the what: the reader is deciding whether this
      # approach would work on their line.
      rationale:
        llm: >
          Why this approach makes sense for this inspection, in 1-2
          plain sentences: what about the part, its defect modes or the
          decision needed makes a {model.type} model the right tool for
          what {model.name} checks. Ground every claim in the material —
          the regions it covers, the classes it separates, the kind of
          judgment the line needs — never generic sales language.
        max_chars: 220

  # -- 7. ONE concise results card for the whole recipe, after every
  # model's training slide. train_acc is pinned to "100%" by design;
  # train_imgs is the LARGEST training-image count any model used,
  # derived deterministically in build_context (em dash when unstated).
  - id: results
    skeleton: concise_results_classifier
    tokens:
      train_acc: "100%"
      train_imgs: "{models.max_train_images}"
      deployment_time:
        llm: >
          Deployment/setup time ONLY if the engineer's notes explicitly
          state it, formatted like "3 days". Otherwise exactly "—".
        max_chars: 20

  # -- 8. IO logic as a diagram. The diagram is THIS flow's actual decision
  # path, not a generic pipeline; the caption says what the setup achieves
  # and why it is built that way.
  - id: logic
    layout: flow
    step: true
    title: "Step {step}: Inspection Logic"
    tokens:
      nodes:
        llm: >
          THIS recipe's actual decision path as exactly 3 stages, each
          "label | sub". Stage 1: what enters the logic — name the real
          inputs (which models' results, per which regions). Stage 2: the
          actual computation applied — the real rule, thresholds, weights
          or grouping from the flow, not a placeholder like "decision
          rule". Stage 3: what is produced and where it goes — the
          camera's verdict and what is written to the plant's systems.
          Labels 2-4 words; subs are the concrete specifics, under ~60
          characters each.
        shape: pairs
      rule:
        llm: "The crux of the pass/fail rule as 2-3 short lines."
        shape: lines
        max_chars: 180
      caption:
        llm: >
          What this IO setup achieves AND why it is built this way: why
          the logic is grouped, weighted or thresholded as it is, and what
          that buys the inspection — only as far as the flow analysis and
          notes actually state it. 2-3 plain sentences.
        max_chars: 300

  # -- 9. the library: on-camera storage of training + production data,
  # v1's fixed-layout skeleton with this run's Library screen in its hole.
  - id: library
    skeleton: library
    images:
      - expects: >
          The camera's Library page — the on-device image store: a browser
          of stored captures (thumbnails or a selected capture) with
          filters and capture metadata.

  # -- 10. the standing closing run, verbatim, template order.
  - closing: default
