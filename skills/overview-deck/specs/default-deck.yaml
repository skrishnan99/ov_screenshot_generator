# The default OV camera test report — THE base spec.
#
# Compiles verbatim; mutates only on an explicit user request, only as
# requested (adapt.py). Content holes are DESCRIPTIONS — matching is
# semantic, so file renames and camera variants cannot break this file.
#
# TRAINED MODELS ONLY: the ROI section and the per-model blocks cover the
# models the Train screen shows as actually trained (last_trained date /
# training metrics / a training report). Models with ROIs that were never
# trained are ignored by design. When the run carries no training signal at
# all, every model is included and the gap is recorded in the plan.
#
# Skeleton fill notes:
# - recipe_title_* keep their standing hero imagery (no image passed);
#   their info block decomposes the recipe name (site/project) and adds
#   the generation date + engineer name from context.
# - ONE concise results card per deck (concise_results_classifier), after
#   all model training slides. On a stat card an em dash is the designed
#   no-data mark, so unstated values resolve "—".

spec_version: 1

slides:
  # -- 1. recipe title: the variant's own skeleton, hero imagery standing.
  # The recipe name is DECOMPOSED here, not shown verbatim: site is the
  # customer, project the inspection — recipe titles usually combine the
  # two. Deducing the split is a judgment call, so site/project are
  # resolver holes; date and engineer come from context, never a model.
  # (the two token blocks are intentionally duplicated, not YAML-anchored:
  # an anchor would alias one dict object into both slides, coupling them
  # under any in-place mutation, e.g. by adapt.py)
  - id: title_ov80i
    skeleton: recipe_title_ov80i
    when: {camera.variant: ov80i}
    tokens:
      site:
        llm: >
          The customer's name, deduced from the recipe title — recipe
          titles usually combine the customer's name with the inspection
          name (e.g. "Traton Bushing Wear" is customer Traton, project
          Bushing Wear). Ground it in the actual recipe name; NEVER
          invent a customer. When no customer part is apparent in the
          title, exactly "—".
        max_chars: 60
      project_name:
        llm: >
          The inspection project's name — the recipe title's
          non-customer part. When no customer part is apparent, the
          whole recipe title is the project. Grounded in the actual
          recipe name, verbatim words from it.
        max_chars: 80
      date: "{date}"
      se_name: "{engineer.name}"

  - id: title_ov20i
    skeleton: recipe_title_ov20i
    when:
      any:
        - {camera.variant: ov20i}
        - {camera.variant: ov10i}
    tokens:
      site:
        llm: >
          The customer's name, deduced from the recipe title — recipe
          titles usually combine the customer's name with the inspection
          name (e.g. "Traton Bushing Wear" is customer Traton, project
          Bushing Wear). Ground it in the actual recipe name; NEVER
          invent a customer. When no customer part is apparent in the
          title, exactly "—".
        max_chars: 60
      project_name:
        llm: >
          The inspection project's name — the recipe title's
          non-customer part. When no customer part is apparent, the
          whole recipe title is the project. Grounded in the actual
          recipe name, verbatim words from it.
        max_chars: 80
      date: "{date}"
      se_name: "{engineer.name}"

  # -- 2. overall results: one-liner + raw|overlay pair, fixed skeleton.
  - id: results_overview
    skeleton: results_image
    tokens:
      recipe_name: "{recipe.name}"
      brief_description:
        llm: >
          One line: the inspection problem and how the camera solves it —
          the part, what is checked, and the decision made.
        max_chars: 160
    # ALWAYS the raw and overlaid versions of the capture shown in the
    # library page screenshot. Agreement with THAT screenshot is the
    # authoritative match criterion — never visual appeal: a dark or
    # blank capture that matches it is correct, and nothing (template
    # image, ROI screen) is ever substituted for the pair. Only an
    # explicit user request (via --request) changes this slide's imagery.
    images:
      - expects: >
          The library capture as imaged — the part photograph at native
          resolution with NO inspection overlay drawn: the same capture
          that appears selected in the library page screenshot.
          Agreement with that screenshot, not visual appeal, is the
          match test; a dark or blank capture that matches is correct.
      - expects: >
          The same library capture WITH the inspection overlay drawn —
          regions and marks as the UI shows them: the same capture that
          appears selected in the library page screenshot. Agreement
          with that screenshot, not visual appeal, is the match test; a
          dark or blank capture that matches is correct.

  # -- 3. imaging setup: fixed content, near-fixed layout (tier 3 + hint).
  - id: imaging
    tier: 3
    step: true
    title: "Step {step}: Imaging Setup"
    hint: >
      One split slide, exactly like the house imaging-setup template: the
      imaging screen on the left at about 55% width. The right-hand
      column reads top to bottom: the standing [intro] copy FIRST as the
      purple intro section, then [heading] as the card's section heading
      (card_title), then the recipe's dynamic configuration line
      ([text]) below it. Title stays as given.
    images:
      - expects: >
          The Imaging Setup screen: camera settings panel (exposure, white
          balance, trigger mode) beside the main viewer.
    tokens:
      # Standing framing copy, every deck, verbatim — a literal is
      # code-enforced to survive arrangement word for word (must-carry),
      # and renders as the split's own purple intro section.
      intro: >
        In the image setup page you define the best configuration for
        your application — exposure, gamma and more. It's one of the
        most important steps, as everything else will be defined by this.
      # Section heading between the intro and the dynamic text — also a
      # literal, so it too is must-carry.
      heading: "Capture Configuration"
      text:
        llm: >
          One line on the imaging configuration, leading with any special
          technique deliberately used — photometric stereo, HDR, rotation,
          multi-exposure. If none, the capture conditions in plain language
          (resolution class, trigger mode).
        max_chars: 170

  # -- 4. alignment, ONLY when the aligner is actually configured — a
  # skipped aligner drops the slide (today's default), and only the
  # user's explicit request (via --request) puts it back.
  - id: aligner
    tier: 3
    step: true
    when: {aligner.skipped: false}
    title: "Step {step}: Alignment"
    hint: >
      One split slide, exactly like the house aligner-setup template: the
      alignment screen left at about 55% width. In the right-hand column
      [heading] is the card's section heading (card_title) with the
      explanation ([text]) below it.
    images:
      - expects: >
          The Template Image and Alignment screen — template viewer and
          search-area controls.
    tokens:
      # Dynamic section heading, like the logic slide's: names the
      # aligner actually in use.
      heading:
        llm: >
          Exactly "Deep Learning Alignment" when the material shows the
          Deep Learning aligner type is selected, exactly "Classical
          Alignment" when the Classical type is; if the material does
          not state the type, exactly "Alignment".
        max_chars: 30
      text:
        llm: >
          One or two lines on how alignment is set up: what the template
          anchors to and what the search areas cover.
        max_chars: 220

  # -- 5. inspection regions: every TRAINED model's ROI screen, one section.
  - id: rois
    tier: 3
    step: true
    title: "Step {step}: Inspection Regions"
    hint: >
      Show every region screen at a readable size — pair two per slide when
      there are several, one large when there is one. Keep the shared
      description with the first slide.
    images:
      # optional: a model whose region screen went uncaptured must not sink
      # the models that WERE captured; all-unmatched still drops the slide.
      - foreach: models
        where: {trained: true}
        optional: true
        expects: >
          The Inspection Setup screen with {model.name} selected and its
          regions of interest drawn on the part — where THIS model looks.
    tokens:
      text:
        llm: >
          A brief description of how the inspection regions are set up
          across the trained models: which areas of the part each model
          covers and how the regions divide the work. 2-3 sentences.
        max_chars: 300

  # -- 6. one training slide per trained model.
  - id: training
    repeat: models
    where: {trained: true}
    tier: 3
    step: true
    title: "Step {step}: Training — {model.name} ({model.type_title})"
    hint: >
      One split slide, like the house setup templates: the block page
      on the left at about 55% width. In the right-hand column the WHAT
      comes first and the WHY after: what this model's inspection does
      ([text]) as the bullets, and the why-this-approach rationale
      ([rationale]) as the footnote beneath them — never as the para
      above.
    images:
      # The TYPE'S BLOCK PAGE, not the Train screen's dialogs: it shows
      # an example annotated training image on the part with the model's
      # classes beside it — the screen a customer can actually read.
      #
      # ladder: judged deterministically before matching. When the block
      # page's viewer shows no actual product photograph, or the image
      # carries no annotations, the model's View All ROIs gallery stands
      # in on this slide; when that gallery is missing too, the block
      # page ships despite its issues — flawed beats empty. A good block
      # page never yields to the gallery.
      - expects: >
          The {model.type} Block page with {model.name} shown — an
          example annotated training image of the part in the viewer,
          with the model's classes listed beside it. Not the Train
          Models screen, not a settings dialog, not an ROI gallery.
        ladder: annotated_block
    tokens:
      # WHAT the model's inspection is trying to do — never how well it
      # did. Training-image counts, accuracy/IoU/loss, iterations and
      # every other result metric live on the results card ONLY, so the
      # deck has exactly one definitive statement of them.
      text:
        llm: >
          What {model.name}'s inspection is trying to do, in plain
          language: the decision it makes on the part, the classes or
          defect classes it separates, and the part areas it judges.
          2-4 short lines. NEVER training-image counts, accuracy, IoU,
          loss, iterations or any training/result metric — those appear
          only on the results card.
        shape: lines
        max_chars: 280
        ban: metrics
      # The WHY, not just the what: the reader is deciding whether this
      # approach would work on their line.
      rationale:
        llm: >
          Why this approach makes sense for this inspection, in 1-2
          plain sentences: what about the part, its defect modes or the
          decision needed makes a {model.type} model the right tool for
          what {model.name} checks. Ground every claim in the material —
          the regions it covers, the classes it separates, the kind of
          judgment the line needs — never generic sales language.
        max_chars: 220

  # -- 7. IO logic: the Node-RED editor screenshot beside what the flow
  # does and why it is built that way — same split shape as the other
  # setup slides. BEFORE the results card: the reader sees the whole
  # pipeline (imaging -> regions -> training -> logic) and then its
  # outcome.
  - id: logic
    tier: 3
    step: true
    title: "Step {step}: Inspection Logic"
    hint: >
      One split slide, like the house setup templates: the Node-RED flow
      screen on the left at about 55% width. In the right-hand column the
      WHAT comes first and the WHY after: the decision-path summary
      ([text]) as the bullets, and the why-this-way rationale
      ([rationale]) as the footnote beneath them — never as the para
      above.
    images:
      - expects: >
          The IO Logic screen, in either of its two layouts: the embedded
          Node-RED flow editor showing this recipe's wired pass/fail logic
          (nodes and connections from the inspection input to the
          outputs), OR the Basic Mode "Pass/Fail & IO Logic" rules page
          (Classification/Segmentation rule builders beside a capture
          preview). Both are the recipe's pass/fail logic.
    tokens:
      text:
        llm: >
          What this recipe's IO logic actually does, as 3-5 short lines:
          the real inputs (which models' results, per which regions), the
          actual rule with its thresholds, weights or grouping from the
          flow or rules — never a placeholder like "decision rule" — and
          what is produced and written out (the camera's verdict, what
          reaches the plant's systems).
        shape: lines
        max_chars: 320
      rationale:
        llm: >
          Why the logic is built this way, in 1-2 plain sentences: why it
          is grouped, weighted or thresholded as it is and what that buys
          the inspection — only as far as the flow analysis and notes
          actually state it.
        max_chars: 220

  # -- 8. ONE concise results card for the whole recipe, after the
  # training slides and the IO logic. train_acc is pinned to "100%" by
  # design — an accuracy figure visible on a model or training report is
  # NOT a reason to change it; only an explicit user request (via
  # --request) is. train_imgs is the LARGEST training-image count any
  # model used, derived deterministically in build_context (em dash when
  # unstated).
  - id: results
    skeleton: concise_results_classifier
    tokens:
      train_acc: "100%"
      train_imgs: "{models.max_train_images}"
      deployment_time:
        llm: >
          Deployment/setup time ONLY if the engineer's notes explicitly
          state it, formatted like "3 days". Otherwise exactly "—".
        max_chars: 20

  # -- 9. the library: on-camera storage of training + production data,
  # a fixed-layout skeleton with this run's Library screen in its hole.
  # Variant-resolved like the title slides: the OV80i gets its own
  # skeleton; ov20i/ov10i keep v1's library.pptx.
  - id: library_ov80i
    skeleton: library_ov80i
    when: {camera.variant: ov80i}
    images:
      - expects: >
          The camera's Library page — the on-device image store: a browser
          of stored captures (thumbnails or a selected capture) with
          filters and capture metadata.

  - id: library_ov20i
    skeleton: library
    when:
      any:
        - {camera.variant: ov20i}
        - {camera.variant: ov10i}
    images:
      - expects: >
          The camera's Library page — the on-device image store: a browser
          of stored captures (thumbnails or a selected capture) with
          filters and capture metadata.

  # -- 10. the standing closing run, verbatim, template order.
  - closing: default
